# Flatpak SDK extension for the Odin compiler.
#
# Build:  flatpak-builder --user --install --force-clean build/dir org.freedesktop.Sdk.Extension.odin.yaml
# Use:    add to an app manifest:
#           sdk-extensions:
#             - org.freedesktop.Sdk.Extension.odin
#           build-options:
#             append-path: /usr/lib/sdk/odin
#         then `. /usr/lib/sdk/odin/enable.sh` in a build command, or set the
#         paths yourself. See README.md.
id: org.freedesktop.Sdk.Extension.odin
branch: '26.08'
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

# Needed to build the compiler, not to use it. The extension ships the libLLVM it
# was linked against, so a consumer needs only this extension.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22

# No .Debug extension: the build commands strip the compiler and libLLVM
# themselves, and this keeps flatpak-builder from extracting anything they leave.
build-options:
  no-debuginfo: true
  prefix: /usr/lib/sdk/odin
  append-path: /usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib

# The compiler is useless without core/base/vendor, and Odin refuses to start if
# ODIN_ROOT lacks the vendor collection, so only cross-platform dead weight goes.
cleanup:
  - '*.a'
  - '*.dll'
  - '*.lib'
  - '*.dylib'

modules:
  - name: odin
    buildsystem: simple
    build-commands:
      - ./build_odin.sh release
      # Flat layout: build_odin.sh links with -Wl,-rpath=$ORIGIN, so libLLVM has
      # to sit beside the binary rather than in a lib/ directory.
      - install -d /usr/lib/sdk/odin
      - cp -r odin core base vendor /usr/lib/sdk/odin/
      # build_odin.sh does not strip, and flatpak-builder does not strip an
      # extension's binaries either: the compiler otherwise ships its DWARF and
      # symbol table for a build nobody can debug.
      - strip /usr/lib/sdk/odin/odin
      # Two globs, and neither may be widened: the compiler links libLLVM-22.so
      # while the real file is libLLVM.so.22.1, and `libLLVM*.so*` would also drag
      # in libLLVMTableGen, a build-time generator with no runtime use.
      - cp -P /usr/lib/sdk/llvm22/lib/libLLVM.so* /usr/lib/sdk/llvm22/lib/libLLVM-*.so*
        /usr/lib/sdk/odin/
      # The llvm extension's libLLVM keeps its static symbol table and some DWARF,
      # 16 MiB that nothing reads; --strip-unneeded keeps the dynamic symbols the
      # compiler links against. Only the regular file: the other two are links.
      - find /usr/lib/sdk/odin -maxdepth 1 -name 'libLLVM*' -type f
        -exec strip --strip-unneeded {} +
      - ls -l /usr/lib/sdk/odin/libLLVM*
      # The licence texts of what the extension ships, each taken from the source
      # it is built from: Odin's own (zlib); utf8proc's (MIT, with the
      # Unicode data licence), which src/utf8proc compiles into the compiler; and
      # LLVM's (Apache-2.0 WITH LLVM-exception) from the llvm22 extension the
      # libLLVM above is copied from. The vendor collection keeps each library's
      # licence beside its code. `make check-licences` fails a build without them.
      - install -Dm644 LICENSE /usr/lib/sdk/odin/share/licenses/odin/LICENSE
      - install -Dm644 src/utf8proc/LICENSE.md
        /usr/lib/sdk/odin/share/licenses/utf8proc/LICENSE.md
      - install -Dm644 /usr/lib/sdk/llvm22/share/licenses/org.freedesktop.Sdk.Extension.llvm22/llvm/LICENSE.TXT
        /usr/lib/sdk/odin/share/licenses/llvm/LICENSE.TXT
      # Prove the shipped compiler runs against the libraries shipped beside it,
      # rather than against whatever the build environment still has loaded.
      - ODIN_ROOT=/usr/lib/sdk/odin /usr/lib/sdk/odin/odin version
    sources:
      # Our fork, carrying one patch: guard the per-target LLVM init calls on
      # `llvm-config --targets-built`, so Odin builds against an LLVM configured
      # for a subset of targets. The llvm22 extension provides X86, AMDGPU, ARM, Mips,
      # NVPTX and WebAssembly (no AArch64, no RISCV), and upstream Odin names
      # those symbols directly, so it will not link here without the patch.
      #
      # Temporary. This returns to odin-lang/Odin at a release tag once the patch
      # is upstream; see MoSCoW.md.
      #
      # llvm-target-guards-dev-2026-10 is the same two patch commits rebased
      # onto upstream dev-2026-10. llvm-target-guards (and its 65474ee commit)
      # stays untouched so the already-published extension's pin keeps resolving.
      - type: git
        url: https://github.com/Hyperquader-Coders/Odin.git
        branch: llvm-target-guards-dev-2026-10
        commit: 0da33798e8ed3e58f8a2824b1f28a30921faa8a3

  - name: scripts
    buildsystem: simple
    build-commands:
      - install -Dm755 enable.sh /usr/lib/sdk/odin/enable.sh
    sources:
      - type: script
        dest-filename: enable.sh
        commands:
          # ODIN_ROOT is how the compiler finds core/base/vendor; without it only
          # a program importing nothing would build.
          - export ODIN_ROOT=/usr/lib/sdk/odin
          - export PATH=$PATH:/usr/lib/sdk/odin
          # Odin links through clang, always: src/linker.cpp calls it by name so
          # it can query the compiler driver's specs for libgcc_s, ld-linux and
          # unwind, whose locations vary by distribution. `-linker:` chooses what
          # runs behind that frontend, not the frontend itself. The freedesktop
          # SDK ships gcc but no clang, so the llvm extension has to be on PATH
          # too or `odin build` compiles and then dies at the link step.
          - 'if [ -d /usr/lib/sdk/llvm22/bin ]; then'
          - '  export PATH=$PATH:/usr/lib/sdk/llvm22/bin'
          - 'else'
          - '  echo "odin-sdk-extension: org.freedesktop.Sdk.Extension.llvm22 is not mounted." >&2'
          - '  echo "odin needs clang to link. Add it to sdk-extensions alongside this one." >&2'
          - 'fi'

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 org.freedesktop.Sdk.Extension.odin.metainfo.xml
        -t /usr/lib/sdk/odin/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.odin.metainfo.xml
