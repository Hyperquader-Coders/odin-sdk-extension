# Build the extension and prove it can compile Odin. Slow by construction: it
# compiles the Odin compiler from source against the llvm22 SDK extension.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      # The freedesktop SDK, the llvm22 extension and an LLVM-linked compiler
      # build outgrow the runner's default free space. These three are the
      # biggest things on it that nothing here needs.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # The packages are the Makefile's lists: DEPS (flatpak, flatpak-builder, shellcheck) for
      # make ci, then deps-flatpak's git for the build's git source, and the SDK and the llvm
      # extension the manifest names, from Flathub.
      - name: system packages, the sdk and llvm extension
        run: |
          sudo apt-get update && make init-packages APT_FLAGS=-y
          make deps-flatpak APT_FLAGS=-y

      # rofiles-fuse needs /dev/fuse, which the runner does not reliably give us.
      - name: build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --state-dir=build/flatpak-builder \
            --repo=build/repo build/dir org.freedesktop.Sdk.Extension.odin.yaml

      # Install what was just built, so the check runs against the artifact
      # rather than against the build tree.
      - name: install from the local repo
        run: |
          flatpak remote-add --user --no-gpg-verify local-repo build/repo
          flatpak install --user --noninteractive \
            local-repo org.freedesktop.Sdk.Extension.odin//26.08
          flatpak list --user --runtime | grep -i odin

      # make ci: the manifest and lint, then check, which compiles and runs a program that
      # imports core:fmt. `odin version` alone would pass with a broken ODIN_ROOT, since it
      # reads no collections.
      - name: make ci
        run: make ci

      - name: bundle
        run: |
          mkdir -p dist
          flatpak build-bundle --runtime build/repo dist/odin-sdk-extension-x86_64.flatpak \
            org.freedesktop.Sdk.Extension.odin 26.08
          ls -lh dist/odin-sdk-extension-x86_64.flatpak

